name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-and-gui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: |
          python -c "import ast,io; [ast.parse(io.open(f, encoding='utf-8').read()) for f in ('lanshare.py','lanshare_gui.py','lanshare_ui.py')]"
          echo "syntax OK"

      - name: Install test deps
        run: python -m pip install --upgrade pip pillow pystray

      - name: Backend tests
        run: python test_lanshare.py

      - name: GUI tests
        run: python test_gui.py

      - name: Relay tests
        run: python test_relay.py
